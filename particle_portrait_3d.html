const im = new Image(); im.src = IMG; await im.decode();
const W = im.naturalWidth, H = im.naturalHeight;
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
const cx = cv.getContext('2d', {willReadFrequently:true}); cx.drawImage(im, 0, 0);
const px = cx.getImageData(0, 0, W, H).data;
const WORLD = 7.2, S = WORLD / W;

// box blur (alpha -> local density / body height)
function blur(a, r){
  const t = new Float32Array(W*H), o = new Float32Array(W*H), w = 2*r + 1;
  for (let y = 0; y < H; y++){ let s = 0; for (let x = -r; x <= r; x++) s += a[y*W + Math.min(W-1, Math.max(0, x))];
    for (let x = 0; x < W; x++){ t[y*W+x] = s/w; s += a[y*W + Math.min(W-1, x+r+1)] - a[y*W + Math.max(0, x-r)]; } }
  for (let x = 0; x < W; x++){ let s = 0; for (let y = -r; y <= r; y++) s += t[Math.min(H-1, Math.max(0, y))*W + x];
    for (let y = 0; y < H; y++){ o[y*W+x] = s/w; s += t[Math.min(H-1, y+r+1)*W + x] - t[Math.max(0, y-r)*W + x]; } }
  return o;
}
const al = new Float32Array(W*H); for (let i = 0; i < W*H; i++) al[i] = px[i*4+3] > 128 ? 1 : 0;
const dens = blur(blur(al, 5), 4), body = blur(blur(blur(al, 26), 20), 14);

// one cloud of grains: fine and dense inside the figure, larger and sparser as it dissolves
const P = [], C = [], Z = [], H0 = [];
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y*W + x; if (!al[i]) continue;
  const d = Math.min(1, dens[i]*1.15), b = body[i];
  let k = 0.05 + 2.0*d*d; let n = Math.floor(k) + (Math.random() < k % 1 ? 1 : 0);
  for (let j = 0; j < n; j++){
    const sz = S*(2.2 + 9.5*Math.pow(1 - d, 1.5))*(0.8 + 0.45*Math.random());
    const loose = Math.pow(1 - d, 1.2);
    const zx = Math.pow(b, 1.6)*1.5 + (Math.random() - 0.5)*(0.1 + 2.4*loose);
    const jit = 0.8 + 0.4*Math.random();
    const o = i*4;
    P.push((x + Math.random() - W/2)*S, -(y + Math.random() - H/2)*S, zx);
    C.push(Math.min(1, px[o]/255*jit), Math.min(1, px[o+1]/255*jit), Math.min(1, px[o+2]/255*jit));
    H0.push(sz);
  }
}
const N = H0.length;
const home = Float32Array.from(P), col = Float32Array.from(C), size = Float32Array.from(H0);
const pos = new Float32Array(N*3), vel = new Float32Array(N*3), seed = new Float32Array(N);
const BX = WORLD*0.62, BY = WORLD*0.62, BZ = 2.2;
for (let i = 0; i < N; i++){ seed[i] = Math.random(); pos[i*3] = (Math.random()*2-1)*BX; pos[i*3+1] = (Math.random()*2-1)*BY; pos[i*3+2] = (Math.random()*2-1)*BZ; }

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
const U = {uTime:{value:0}, uScale:{value:600}};
// every grain is a lit sphere: diffuse + specular highlight gives the bead texture
const mat = new THREE.ShaderMaterial({uniforms:U,
  vertexShader:`uniform float uTime,uScale;attribute vec3 aCol;attribute float aSize,aSeed;varying vec3 vC;
  void main(){float s=aSeed*6.2831;
   vec3 p=position+vec3(sin(uTime*1.5+s),cos(uTime*1.2+s*1.7),sin(uTime*1.8+s*2.3))*0.006;
   vec4 mv=modelViewMatrix*vec4(p,1.);
   gl_PointSize=clamp(aSize*uScale/(-mv.z),1.,48.);
   gl_Position=projectionMatrix*mv;
   vC=aCol+0.10*pow(max(0.,sin(p.x*0.8+p.y*0.4-uTime*1.2)),14.);}`,
  fragmentShader:`varying vec3 vC;
  void main(){vec2 q=gl_PointCoord*2.-1.;float r=dot(q,q);if(r>1.)discard;
   vec3 n=vec3(q.x,-q.y,sqrt(1.-r));vec3 L=normalize(vec3(-.4,.6,.7));
   float d=max(dot(n,L),0.);float sp=pow(max(dot(reflect(-L,n),vec3(0.,0.,1.)),0.),22.);
   gl_FragColor=vec4(vC*(.5+.62*d)*(.8+.2*n.z)+sp*.3,1.);}`});
scene.add(new THREE.Points(geo, mat));

// faint white dust drifting around the figure
const DN = 1800, dpos = new Float32Array(DN*3), dgeo = new THREE.BufferGeometry();
for (let i = 0; i < DN; i++) dpos.set([(Math.random()*2-1)*BX*1.1, (Math.random()*2-1)*BY, (Math.random()*2-1)*BZ*1.5], i*3);
dgeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
const dc = document.createElement('canvas'); dc.width = dc.height = 32;
const dg = dc.getContext('2d'), gr = dg.createRadialGradient(16,16,1,16,16,15);
gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(1,'rgba(255,255,255,0)'); dg.fillStyle = gr; dg.fillRect(0,0,32,32);
scene.add(new THREE.Points(dgeo, new THREE.PointsMaterial({size:0.07, map:new THREE.CanvasTexture(dc), transparent:true, opacity:0.75, depthWrite:false, color:0xffffff})));

const mouse = new THREE.Vector2(), ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0), hit = new THREE.Vector3();
let active = false;
addEventListener('pointermove', e => { mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); active = true; });
addEventListener('pointerdown', e => { mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); active = true; ray.setFromCamera(mouse, camera); ray.ray.intersectPlane(plane, hit); SW.on = true; SW.x = hit.x; SW.y = hit.y; SW.age = 0; });
addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') active = false; });
addEventListener('pointercancel', () => active = false);
document.documentElement.addEventListener('mouseleave', () => active = false);

function resize(){
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  camera.position.z = Math.max(WORLD*1.12/(2*t), WORLD*1.12/camera.aspect/(2*t), 5);
  camera.updateProjectionMatrix();
  U.uScale.value = renderer.domElement.height/(2*t);
}
addEventListener('resize', resize); resize();

const RADIUS = 0.9, PUSH = 0.05, SPRING = 0.012, DAMP = 0.92, REB = 0.3;
const ph = new THREE.Vector3(), SW = {on:false, x:0, y:0, age:0};
let wasActive = false, mvx = 0, mvy = 0, spd = 0;
function tick(){
  U.uTime.value = performance.now()/1000;
  camera.position.x += (mouse.x*1.8 - camera.position.x)*0.04;
  camera.position.y += (mouse.y*1.0 - camera.position.y)*0.04;
  camera.lookAt(0, 0, 0); camera.updateMatrixWorld();
  if (active){
    ray.setFromCamera(mouse, camera); ray.ray.intersectPlane(plane, hit);
    if (wasActive){ mvx = mvx*0.6 + (hit.x-ph.x)*0.4; mvy = mvy*0.6 + (hit.y-ph.y)*0.4; } else mvx = mvy = 0;
    ph.copy(hit); wasActive = true;
  } else { wasActive = false; mvx *= 0.8; mvy *= 0.8; }
  spd = Math.min(Math.hypot(mvx, mvy)*6, 1.5);
  const R2 = RADIUS*RADIUS, ring = SW.on ? SW.age*0.14 : 0;
  if (SW.on && ++SW.age > 60) SW.on = false;
  for (let i = 0; i < N; i++){
    const k = i*3; let vx = vel[k], vy = vel[k+1], vz = vel[k+2], x = pos[k], y = pos[k+1], z = pos[k+2];
    if (active){
      const dx = x-hit.x, dy = y-hit.y, d2 = dx*dx + dy*dy;
      if (d2 < R2){
        const d = Math.sqrt(d2) + 1e-4, f = 1 - d/RADIUS, s = f*f*PUSH*(0.6 + spd), nx = dx/d, ny = dy/d;
        vx += nx*s - ny*s*0.9 + mvx*f*0.9 + (Math.random()-0.5)*s;
        vy += ny*s + nx*s*0.9 + mvy*f*0.9 + (Math.random()-0.5)*s;
        vz += (Math.random()-0.5)*s*4;
      }
    }
    if (SW.on){
      const dx = x-SW.x, dy = y-SW.y, d = Math.sqrt(dx*dx + dy*dy) + 1e-4, w = d - ring;
      if (w > -0.4 && w < 0.4){ const s = 0.09*(1 - Math.abs(w)/0.4)*(1 - SW.age/60); vx += dx/d*s; vy += dy/d*s; vz += (Math.random()-0.5)*s*2; }
    }
    vx = (vx + (home[k]-x)*SPRING)*DAMP; vy = (vy + (home[k+1]-y)*SPRING)*DAMP; vz = (vz + (home[k+2]-z)*SPRING)*DAMP;
    x += vx; y += vy; z += vz;
    if (x > BX){ x = BX; vx *= -REB; } else if (x < -BX){ x = -BX; vx *= -REB; }
    if (y > BY){ y = BY; vy *= -REB; } else if (y < -BY){ y = -BY; vy *= -REB; }
    if (z > BZ){ z = BZ; vz *= -REB; } else if (z < -BZ){ z = -BZ; vz *= -REB; }
    vel[k] = vx; vel[k+1] = vy; vel[k+2] = vz; pos[k] = x; pos[k+1] = y; pos[k+2] = z;
  }
  for (let i = 0; i < DN; i++){ const k = i*3; dpos[k+1] += 0.003 + (i%5)*0.0005; dpos[k] += Math.sin(U.uTime.value*0.5 + i)*0.0015; if (dpos[k+1] > BY) dpos[k+1] = -BY; }
  dgeo.attributes.position.needsUpdate = true; geo.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
})();
</script>
